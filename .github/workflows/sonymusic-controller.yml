name: SONYMUSIC Controller

on:
  workflow_run:
    workflows: ["Run SONYMUSIC"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: sonymusic-controller
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Watch, restart and hand over SONYMUSIC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          WORKFLOW="run-sonymusic.yml"
          CONTROLLER_WORKFLOW="sonymusic-controller.yml"
          BRANCH="main"
          BOT_HANDOVER_MINUTES=335
          CONTROLLER_HANDOVER_MINUTES=335
          controller_started="$(date -u +%s)"
          controller_handover_done=false

          dispatch_bot() {
            gh workflow run "$WORKFLOW" --repo "$REPO" --ref "$BRANCH"
          }

          dispatch_controller() {
            if [[ "$controller_handover_done" == "true" ]]; then return; fi
            controller_handover_done=true
            gh workflow run "$CONTROLLER_WORKFLOW" --repo "$REPO" --ref "$BRANCH"
          }

          active_json() {
            gh run list --repo "$REPO" --workflow "$WORKFLOW" --branch "$BRANCH" --limit 100 --json databaseId,status,conclusion,createdAt,number |
              jq '[.[] |
                select(
                  .status == "queued" or
                  .status == "in_progress" or
                  .status == "waiting" or
                  .status == "pending" or
                  .status == "requested"
                ) |
                {
                  id: .databaseId,
                  status: .status,
                  conclusion: .conclusion,
                  created_at: .createdAt,
                  run_number: .number
                }
              ] | sort_by(.created_at)'
          }

          is_ready() {
            local run_id="$1"
            [[ "$run_id" =~ ^[0-9]+$ ]] || return 1
            gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/actions/runs/$run_id/jobs?per_page=100" |
              jq -e '[.jobs[].steps[]? |
                select(.name == "Verify bot ready" and .conclusion == "success")
              ] | length > 0' >/dev/null
          }

          cancel_run() {
            local run_id="$1"
            [[ "$run_id" =~ ^[0-9]+$ ]] || return 0
            gh api --method POST -H "Accept: application/vnd.github+json" "/repos/$REPO/actions/runs/$run_id/cancel" >/dev/null || true
          }

          while true; do
            now="$(date -u +%s)"
            age=$(( (now - controller_started) / 60 ))

            if (( age >= CONTROLLER_HANDOVER_MINUTES )); then
              dispatch_controller
              sleep 30
              continue
            fi

            active="$(active_json)"
            count="$(jq 'length' <<<"$active")"

            if (( count == 0 )); then
              dispatch_bot
              sleep 30
              continue
            fi

            newest="$(jq 'last' <<<"$active")"
            newest_id="$(jq -r '.id' <<<"$newest")"
            newest_number="$(jq -r '.run_number' <<<"$newest")"
            newest_created="$(jq -r '.created_at' <<<"$newest")"

            if ! [[ "$newest_id" =~ ^[0-9]+$ ]]; then
              echo "Invalid newest run id: $newest_id"
              sleep 30
              continue
            fi

            echo "Watching newest SONYMUSIC run #$newest_number (id=$newest_id)"

            if is_ready "$newest_id"; then
              jq -r --arg target "$newest_id" '.[] | select((.id|tostring) != $target) | .id' <<<"$active" |
              while read -r old_id; do
                [[ -n "$old_id" ]] && cancel_run "$old_id"
              done
            else
              now="$(date -u +%s)"
              created="$(date -u -d "$newest_created" +%s)"
              bot_age=$(( (now - created) / 60 ))
              if (( bot_age >= BOT_HANDOVER_MINUTES )); then
                dispatch_bot
                sleep 60
                continue
              fi
            fi

            sleep 30
          done
