name: SONYMUSIC Controller

on:
  workflow_dispatch:

concurrency:
  group: sonymusic-controller
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Watch, recover and hand over SONYMUSIC controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          WORKFLOW="run-sonymusic.yml"
          CONTROLLER_WORKFLOW="sonymusic-controller.yml"
          BRANCH="main"

          CONTROLLER_HANDOVER_MINUTES=335
          controller_started="$(date -u +%s)"
          controller_handover_done=false
          last_recovery=0

          dispatch_worker() {
            gh workflow run "$WORKFLOW" --repo "$REPO" --ref "$BRANCH"
          }

          dispatch_controller() {
            if [[ "$controller_handover_done" == "true" ]]; then
              return
            fi

            controller_handover_done=true
            echo "5h35m reached. Dispatching new SONYMUSIC controller..."
            gh workflow run "$CONTROLLER_WORKFLOW" --repo "$REPO" --ref "$BRANCH"
            echo "New controller dispatched. Current controller will finish its handover cycle without being cancelled by an external trigger."
          }

          active_json() {
            gh run list               --repo "$REPO"               --workflow "$WORKFLOW"               --branch "$BRANCH"               --limit 100               --json databaseId,status,createdAt,number               | jq '[.[] |
                  select(
                    .status == "queued" or
                    .status == "in_progress" or
                    .status == "waiting" or
                    .status == "pending" or
                    .status == "requested"
                  ) |
                  {
                    id: .databaseId,
                    status: .status,
                    created_at: .createdAt,
                    run_number: .number
                  }
                ] | sort_by(.created_at)'
          }

          echo "SONYMUSIC Controller supervisor started."

          while true; do
            now="$(date -u +%s)"
            age_minutes=$(( (now - controller_started) / 60 ))

            if (( age_minutes >= CONTROLLER_HANDOVER_MINUTES )); then
              dispatch_controller
              sleep 30
              continue
            fi

            active="$(active_json)"
            count="$(jq 'length' <<< "$active")"

            echo "SONYMUSIC worker runs currently active/queued: $count"
            jq . <<< "$active"

            if (( count == 0 )); then
              if (( now - last_recovery >= 120 )); then
                echo "No SONYMUSIC worker is active or queued. Starting recovery worker..."
                dispatch_worker
                last_recovery=$now
              else
                echo "Recovery cooldown active."
              fi
            else
              echo "Worker exists. No duplicate worker will be started."
            fi

            sleep 30
          done
