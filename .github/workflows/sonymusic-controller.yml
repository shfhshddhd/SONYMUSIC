name: SONYMUSIC Controller

on:
  workflow_run:
    workflows: ["Run SONYMUSIC"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: sonymusic-controller
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Monitor SONYMUSIC worker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          WORKFLOW="run-sonymusic.yml"
          BRANCH="main"
          started="$(date +%s)"
          last_recovery=0

          echo "SONYMUSIC Controller supervisor started."

          while true; do
            now="$(date +%s)"
            age=$((now - started))

            active_json="$(gh run list               --repo "$REPO"               --workflow "$WORKFLOW"               --branch "$BRANCH"               --limit 100               --json databaseId,status,createdAt,number               | jq '[.[] |
                  select(
                    .status == "queued" or
                    .status == "in_progress" or
                    .status == "waiting" or
                    .status == "pending" or
                    .status == "requested"
                  ) |
                  {
                    id: .databaseId,
                    status: .status,
                    created_at: .createdAt,
                    run_number: .number
                  }
                ] | sort_by(.created_at)')"

            count="$(jq 'length' <<< "$active_json")"
            echo "SONYMUSIC worker runs currently active/queued: $count"
            jq . <<< "$active_json"

            if (( count == 0 )); then
              if (( now - last_recovery >= 120 )); then
                echo "No SONYMUSIC worker is active or queued. Starting recovery worker..."
                gh workflow run "$WORKFLOW" --repo "$REPO" --ref "$BRANCH"
                last_recovery=$now
              else
                echo "Recovery cooldown active."
              fi
            else
              echo "Worker exists. No duplicate worker will be started."
            fi

            if (( age >= 19800 )); then
              echo "Controller checkpoint reached after 5h30m; exiting cleanly."
              exit 0
            fi

            sleep 30
          done
