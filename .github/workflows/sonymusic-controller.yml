name: SONYMUSIC Controller

on:
  workflow_run:
    workflows: ["Run SONYMUSIC"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

# Controller runs are short reconciliation jobs.
# A scheduled invocation may replace an older controller invocation safely.
concurrency:
  group: sonymusic-controller
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Reconcile SONYMUSIC worker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          WORKFLOW="run-sonymusic.yml"
          BRANCH="main"

          active_json="$(gh run list             --repo "$REPO"             --workflow "$WORKFLOW"             --branch "$BRANCH"             --limit 100             --json databaseId,status,createdAt,number             | jq '[.[] |
                select(
                  .status == "queued" or
                  .status == "in_progress" or
                  .status == "waiting" or
                  .status == "pending" or
                  .status == "requested"
                ) |
                {
                  id: .databaseId,
                  status: .status,
                  created_at: .createdAt,
                  run_number: .number
                }
              ] | sort_by(.created_at)')"

          count="$(jq 'length' <<< "$active_json")"
          echo "Active SONYMUSIC workflow runs: $count"
          jq . <<< "$active_json"

          if (( count == 0 )); then
            echo "No SONYMUSIC worker is active or queued. Starting a recovery worker..."
            gh workflow run "$WORKFLOW" --repo "$REPO" --ref "$BRANCH"
          else
            echo "Worker already exists. No additional worker will be dispatched."
            echo "This preserves the single-worker STRING_SESSION safety rule."
          fi
