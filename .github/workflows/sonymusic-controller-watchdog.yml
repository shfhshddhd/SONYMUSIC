name: SONYMUSIC Controller Watchdog

on:
  workflow_run:
    workflows: ["Run SONYMUSIC"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: sonymusic-controller-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  ensure-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ensure exactly one controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          CONTROLLER_WORKFLOW="sonymusic-controller.yml"
          BRANCH="main"

          active_controllers="$(gh run list             --repo "$REPO"             --workflow "$CONTROLLER_WORKFLOW"             --branch "$BRANCH"             --limit 20             --json databaseId,status,createdAt,number             | jq '[.[] |
                select(
                  .status == "queued" or
                  .status == "in_progress" or
                  .status == "waiting" or
                  .status == "pending" or
                  .status == "requested"
                ) |
                {
                  id: .databaseId,
                  status: .status,
                  created_at: .createdAt,
                  run_number: .number
                }
              ] | sort_by(.created_at)')"

          count="$(jq 'length' <<< "$active_controllers")"

          echo "Active/queued SONYMUSIC controllers: $count"
          jq . <<< "$active_controllers"

          if (( count == 0 )); then
            echo "No active SONYMUSIC controller found. Starting one..."
            gh workflow run "$CONTROLLER_WORKFLOW" --repo "$REPO" --ref "$BRANCH"
            echo "Controller dispatched successfully."
          else
            echo "Controller already exists. No action taken."
          fi
